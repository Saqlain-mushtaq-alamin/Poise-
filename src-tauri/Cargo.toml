[package]
name = "poise"
version = "0.1.0"
description = "Poise — offline-first interview & IELTS speaking coach"
authors = ["Poise"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }
keyring = "3"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
# This feature is used for production builds where `devPath` points to the
# static frontend `dist` bundle instead of the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "poise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "poise"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
