openapi: 3.0.3
info:
  title: Poise Scoring & Progress API
  version: 0.1.0
  description: >
    Phase 8 deliverable. Fuses per-phase scores into one report, plus
    history, trends, readiness, coverage, debrief chat, playbooks, replay,
    and model-answer diffing.

paths:
  /scoring/sessions/{id}/report:
    get:
      summary: Get (or compute + cache) the fused report for a session
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: refresh
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FusedReport' }

  /scoring/sessions/{id}/report/pdf:
    get:
      summary: Download the report as a PDF
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        "200":
          content:
            application/pdf: {}

  /scoring/history:
    get:
      summary: List past sessions (paginated, filterable by mode)
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [interview, ielts] }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionSummary' }

  /scoring/trends:
    get:
      summary: Score trend + per-dimension averages across recent sessions
      parameters:
        - name: mode
          in: query
          schema: { type: string }
        - name: last_n
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrendData' }

  /scoring/readiness:
    get:
      summary: "'Am I ready?' verdict based on session history"
      parameters:
        - name: mode
          in: query
          schema: { type: string }
        - name: target_score
          in: query
          schema: { type: number, default: 75 }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessVerdict' }

  /scoring/sessions/{id}/replay:
    get:
      summary: Best-effort timeline reconstruction of the session
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplayData' }

  /scoring/sessions/{id}/coverage:
    post:
      summary: JD coverage matrix for this session's questions
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [jd_text]
              properties: { jd_text: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverageMatrix' }

  /scoring/sessions/{id}/debrief:
    post:
      summary: Send a debrief chat message, get the coach's reply
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties: { message: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebriefMessage' }
    get:
      summary: Get debrief conversation history (generates the opening message on first call)
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DebriefMessage' }

  /scoring/playbooks:
    get:
      summary: All improvement playbooks (static reference data)
      responses:
        "200": { description: "Map of playbook key -> playbook" }

  /scoring/sessions/{id}/playbooks:
    get:
      summary: Playbooks relevant to this specific session's weaknesses
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        "200": { description: "Array of playbooks, ranked by relevance" }

  /scoring/sessions/{id}/questions/{question_index}/model-answer:
    post:
      summary: Generate a model answer for one question, diffed against the candidate's actual answer
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: question_index
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                jd_summary: { type: string }
                resume_summary: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelAnswerResponse' }
        "404": { description: question_index out of range }

components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string }

  schemas:
    ScoreDimension:
      type: object
      properties:
        name: { type: string }
        score: { type: number }
        max_score: { type: number }
        weight: { type: number }
        description: { type: string }
        available: { type: boolean }

    ActionItem:
      type: object
      properties:
        priority: { type: string, enum: [high, medium, low] }
        category: { type: string, enum: [content, delivery, technical, communication] }
        description: { type: string }
        suggested_practice: { type: string }

    SentenceAnnotation:
      type: object
      properties:
        text: { type: string }
        rating: { type: string, enum: [strong, adequate, weak, filler, off_topic] }
        reason: { type: string }
        suggestion: { type: string, nullable: true }
        highlight_color: { type: string }

    AnnotatedAnswer:
      type: object
      properties:
        sentences:
          type: array
          items: { $ref: '#/components/schemas/SentenceAnnotation' }
        overall_structure: { type: string, enum: [well_structured, rambling, too_brief, unfocused] }

    QuestionBreakdown:
      type: object
      properties:
        question: { type: string }
        user_answer: { type: string }
        score: { type: number }
        skill_tags: { type: array, items: { type: string } }
        annotated_answer: { $ref: '#/components/schemas/AnnotatedAnswer' }

    FusedReport:
      type: object
      properties:
        session_id: { type: string }
        mode: { type: string, enum: [interview, ielts] }
        overall_score: { type: number }
        dimensions: { type: array, items: { $ref: '#/components/schemas/ScoreDimension' } }
        strengths: { type: array, items: { type: string } }
        improvements: { type: array, items: { type: string } }
        action_items: { type: array, items: { $ref: '#/components/schemas/ActionItem' } }
        per_question_breakdown: { type: array, items: { $ref: '#/components/schemas/QuestionBreakdown' } }
        duration_minutes: { type: number }
        generated_at: { type: string, format: date-time }
        persona_label: { type: string }
        jd_title: { type: string }

    SessionSummary:
      type: object
      properties:
        session_id: { type: string }
        mode: { type: string }
        overall_score: { type: number }
        duration_minutes: { type: number }
        persona_label: { type: string, nullable: true }
        jd_title: { type: string, nullable: true }
        generated_at: { type: string, format: date-time }

    TrendData:
      type: object
      properties:
        points:
          type: array
          items:
            type: object
            properties:
              session_id: { type: string }
              generated_at: { type: string, format: date-time }
              overall_score: { type: number }
              dimension_scores: { type: object, additionalProperties: { type: number } }
        dimension_averages: { type: object, additionalProperties: { type: number } }
        overall_trend: { type: string, enum: [improving, stable, declining] }

    ReadinessVerdict:
      type: object
      properties:
        verdict: { type: string, enum: [ready, almost_ready, not_ready, insufficient_data] }
        confidence: { type: number }
        latest_score: { type: number }
        average_score: { type: number }
        trend: { type: string }
        is_consistent: { type: boolean }
        evidence: { type: array, items: { type: string } }
        recommendation: { type: string }

    CoverageMatrix:
      type: object
      properties:
        required_skills: { type: array, items: { type: string } }
        coverage:
          type: array
          items:
            type: object
            properties:
              skill: { type: string }
              covered: { type: boolean }
              evidence_question: { type: string, nullable: true }
              confidence: { type: number }
        coverage_pct: { type: number }
        gaps: { type: array, items: { type: string } }

    DebriefMessage:
      type: object
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        created_at: { type: string, format: date-time }

    ReplayData:
      type: object
      properties:
        session_id: { type: string }
        duration_minutes: { type: number }
        events:
          type: array
          items:
            type: object
            properties:
              timestamp_s: { type: number }
              kind: { type: string, enum: [question, answer, note] }
              label: { type: string }
              detail: { type: string }

    ModelAnswerResponse:
      type: object
      properties:
        model_answer:
          type: object
          properties:
            full_text: { type: string }
            framework_used: { type: string }
            key_elements: { type: array, items: { type: string } }
            why_it_works: { type: string }
            is_placeholder: { type: boolean }
        diff:
          type: object
          properties:
            segments:
              type: array
              items:
                type: object
                properties:
                  text: { type: string }
                  kind: { type: string, enum: [unchanged, added, removed] }
            similarity_ratio: { type: number }
